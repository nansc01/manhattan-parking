<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Manhattan Free Parking</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,700..900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Look: frosted-glass cards floating over a calm gray map; green is the only loud color, so free parking pops. */
:root{
  --glass:rgba(255,255,255,.78); --panel:#ffffff; --fg:#0f1d16; --muted:#62716a; --line:rgba(15,29,22,.08);
  --go:#00b35c; --go-2:#008a47; --go-dark:#00733b; --go-soft:#e2f7ec; --pay:#f29100; --stop:#e0303f; --me:#1a73e8;
  --shadow:0 10px 30px rgba(15,29,22,.16),0 2px 6px rgba(15,29,22,.08);
  --display:"Archivo","Arial Black",system-ui,sans-serif;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#eceeec;color:var(--fg);font-family:var(--font);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;background:#eceeec}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--me);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow)}

/* top card */
.top{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.psign{width:38px;height:38px;border-radius:10px;background:linear-gradient(150deg,var(--go),var(--go-2));color:#fff;display:grid;place-items:center;
  font:900 24px/1 var(--display);box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.9),0 4px 10px rgba(0,138,71,.35);flex:none}
.brand .t{min-width:0;flex:1;line-height:1.15}
.brand b{display:block;font:800 1.05rem/1.1 var(--display);font-stretch:112%;letter-spacing:-.01em;text-transform:uppercase}
.brand small{color:var(--muted);font-size:.85rem}
.tag{font-size:.75rem;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(15,29,22,.06);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--go-soft);color:var(--go-dark)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(15,29,22,.06);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 0;font-size:.9rem;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--fg);color:#fff;box-shadow:0 3px 8px rgba(15,29,22,.25)}
.places{display:flex;gap:6px}
.places button{flex:1;border:0;background:rgba(15,29,22,.06);border-radius:999px;padding:9px 0;font-size:.9rem;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.places button[aria-pressed="true"]{background:var(--go-soft);color:var(--go-dark);box-shadow:inset 0 0 0 1.5px var(--go)}

/* floating controls */
.locate{position:fixed;z-index:1000;right:max(12px,env(safe-area-inset-right,0px));width:52px;height:52px;border-radius:50%;color:var(--me);display:grid;place-items:center}
.legend{position:fixed;z-index:1000;left:max(12px,env(safe-area-inset-left,0px));border-radius:999px;padding:8px 12px;display:flex;gap:12px;font-size:.78rem;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:5px;border-radius:3px;margin-right:5px;vertical-align:middle}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;border-radius:24px 24px 0 0;border-bottom:0;
  padding:6px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(14px,env(safe-area-inset-left,0px))}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(15,29,22,.18);margin:4px auto 10px;border:0;display:block;padding:0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sheet-head h2{margin:0;font:800 1.05rem/1.1 var(--display);font-stretch:108%;text-transform:uppercase;letter-spacing:-.01em}
.count{font-size:.8rem;font-weight:700;color:var(--go-dark);background:var(--go-soft);padding:5px 10px;border-radius:999px;white-space:nowrap}
#list{max-height:30vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:2px}
.sheet.collapsed #list{display:none}
.msg{padding:10px 0;color:var(--muted)}
.spot{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--panel);box-shadow:0 1px 3px rgba(15,29,22,.08);cursor:pointer;animation:rise .35s ease both}
.spot:nth-child(2){animation-delay:.05s}.spot:nth-child(3){animation-delay:.1s}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.spot > div{min-width:0}
.n{width:32px;height:32px;border-radius:50%;background:linear-gradient(150deg,var(--go),var(--go-2));color:#fff;font:800 15px/32px var(--display);text-align:center;box-shadow:0 3px 8px rgba(0,138,71,.35)}
.street{font:800 1.1rem/1.15 var(--display);letter-spacing:-.01em}
.between{font-size:.85rem;color:var(--muted);line-height:1.3;margin-top:1px}
.until{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:.82rem;font-weight:700;color:var(--go-dark);background:var(--go-soft);padding:4px 9px;border-radius:999px}
.until b{font:800 .9rem/1 var(--display);white-space:nowrap}
.until{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.go{display:inline-flex;align-items:center;gap:6px;font:800 .95rem/1 var(--display);letter-spacing:.02em;padding:12px 14px;border-radius:14px;background:linear-gradient(150deg,var(--go),var(--go-2));color:#fff;text-decoration:none;box-shadow:0 4px 12px rgba(0,138,71,.35)}
.go svg{flex:none}

/* map bits */
.pin{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%)}
.pin span{background:var(--fg);color:#fff;font:800 12px/1 var(--display);padding:7px 10px;border-radius:10px;white-space:nowrap;box-shadow:var(--shadow)}
.pin i{width:0;height:0;border:6px solid transparent;border-top-color:var(--fg)}
.num{position:relative;width:30px;height:30px;border-radius:50%;background:linear-gradient(150deg,var(--go),var(--go-2));color:#fff;font:800 15px/30px var(--display);text-align:center;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
.num::after,.medot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--go);animation:pulse 2s ease-out infinite}
.medot{position:relative;width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
.medot::after{border-color:var(--me)}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.num::after,.medot::after{animation:none;opacity:0}.spot{animation:none}}
.leaflet-popup-content-wrapper{border-radius:16px;box-shadow:var(--shadow)}
.leaflet-popup-content{margin:14px 16px;font-family:var(--font);font-size:.92rem;line-height:1.4}
.pop .street{font-size:1.1rem}
.pop .s{font-weight:700;margin:6px 0 10px}
.pop details{margin-top:10px;color:var(--muted);font-size:.8rem}
.pop ul{margin:4px 0 0;padding-left:16px}
.pop .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pop .ghost{display:inline-flex;align-items:center;gap:6px;font:700 .85rem/1 var(--font);padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--fg);text-decoration:none}
.mine{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:700;color:#5b3fd6;background:#efeaff;padding:4px 8px;border-radius:999px}
/* sign editor */
.ed-back{position:fixed;inset:0;z-index:2000;background:rgba(15,29,22,.35);display:flex;align-items:flex-end;justify-content:center}
.ed{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:rise .25s ease both}
.ed h3{margin:0;font:800 1.15rem/1.15 var(--display);text-transform:uppercase}
.ed .between{margin-top:-6px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;font-weight:700;font-size:.9rem;color:var(--fg);text-align:left;line-height:1.25}
.quick button small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:2px}
.quick button.on{border-color:var(--go);background:var(--go-soft)}
.lbl{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{border:1.5px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.row-top{display:flex;gap:6px;align-items:center}
.kinds{display:flex;gap:4px;flex:1;background:rgba(15,29,22,.06);padding:3px;border-radius:10px}
.kinds button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 2px;font-weight:700;font-size:.82rem;color:var(--muted)}
.kinds button[aria-pressed="true"][data-k="meter"]{background:var(--pay);color:#fff}
.kinds button[aria-pressed="true"][data-k="stop"]{background:var(--stop);color:#fff}
.kinds button[aria-pressed="true"][data-k="asp"]{background:var(--fg);color:#fff}
.del{border:0;background:transparent;font-size:1.3rem;color:var(--muted);width:40px;height:40px;border-radius:10px}
.dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dchips button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;font-weight:700;font-size:.8rem;color:var(--muted)}
.dchips button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#fff}
.tm{display:flex;gap:8px;align-items:center}
.tm input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;color:var(--fg);background:#fff}
.addrow{border:1.5px dashed var(--line);background:#fff;border-radius:14px;padding:12px;font-weight:700;color:var(--fg)}
.ed-foot{display:flex;gap:8px}
.ed-foot button{flex:1;border:0;border-radius:14px;padding:14px;font:800 1rem/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.save{background:linear-gradient(150deg,var(--go),var(--go-2));color:#fff}
.cancel{background:rgba(15,29,22,.07);color:var(--fg)}
.reset{border:0;background:transparent;color:var(--stop);font-weight:700;padding:6px;align-self:center}
.note{font-size:.8rem;color:var(--muted)}
.leaflet-control-attribution{font-size:9px;opacity:.6;background:transparent!important}
</style>
</head>
<body>
<div id="map" aria-label="Map of parking by block"></div>

<div class="top glass">
  <div class="brand"><span class="psign" aria-hidden="true">P</span><div class="t"><b>Manhattan Free Parking</b><small id="clock">—</small></div><span class="tag" id="dayTag"></span></div>
  <div class="seg" role="group" aria-label="When">
    <button aria-pressed="true" data-h="0">Now</button>
    <button aria-pressed="false" data-h="1">+1 hr</button>
    <button aria-pressed="false" data-h="2">+2 hr</button>
    <button aria-pressed="false" data-h="4">+4 hr</button>
  </div>
  <div class="places" id="places" role="group" aria-label="Search near">
    <button aria-pressed="false" data-p="me">Near me</button>
    <button aria-pressed="true" data-p="0">★ 18 W 33rd St</button>
  </div>
</div>

<button class="locate glass" id="locate" aria-label="Show my location">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<div class="legend glass" id="legend"><span><i style="background:var(--go)"></i>Free</span><span><i style="background:var(--pay)"></i>Meter</span><span><i style="background:var(--stop)"></i>No parking</span></div>

<div class="sheet glass" id="sheet">
  <button class="grab" id="grab" aria-label="Show or hide list"></button>
  <div class="sheet-head">
    <h2 id="sheetTitle">Free parking nearby</h2>
    <span class="count" id="count"></span>
  </div>
  <div id="list"><div class="msg">Loading…</div></div>
</div>

<div class="ed-back" id="edBack" hidden>
  <div class="ed" role="dialog" aria-modal="true" aria-labelledby="edTitle">
    <h3 id="edTitle">Fix this block</h3>
    <div class="between" id="edWhere"></div>
    <div class="lbl">Quick fix</div>
    <div class="quick">
      <button id="qFree">No meter here<small>Free outside the other signs</small></button>
      <button id="qCustom" class="on">Enter the sign<small>Type what the sign says</small></button>
    </div>
    <div id="custom" style="display:flex;flex-direction:column;gap:10px">
      <div class="lbl">What the sign says</div>
      <div id="rows" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="addrow" id="addRow">+ Add another line from the sign</button>
      <label class="note" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="replace" checked> Use only my sign, ignore the city's signs for this block</label>
    </div>
    <div class="ed-foot"><button class="cancel" id="edCancel">Cancel</button><button class="save" id="edSave">Save</button></div>
    <button class="reset" id="edReset" hidden>Remove my changes</button>
    <div class="note">Saved on this phone only.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="core.js"></script>
<script src="corrections.js"></script>
<script>
const P=window.Park;
proj4.defs("EPSG:2263","+proj=lcc +lat_1=41.03333333333333 +lat_2=40.66666666666666 +lat_0=40.16666666666666 +lon_0=-74 +x_0=300000.0000000001 +y_0=0 +ellps=GRS80 +datum=NAD83 +to_meter=0.3048006096012192 +no_defs");
const toLL=(x,y)=>{const [lon,lat]=proj4("EPSG:2263","WGS84",[x,y]);return [lat,lon];};
const toSP=(lat,lon)=>proj4("WGS84","EPSG:2263",[lon,lat]);

// Clean gray base map with street names on top (Esri, no key needed)
const map=L.map("map",{zoomControl:false,preferCanvas:true,renderer:L.canvas({tolerance:10})}).setView([40.7481,-73.9862],17);
const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
L.tileLayer(ESRI+"World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:16,attribution:"Esri · Signs: NYC DOT"}).addTo(map);
map.createPane("labels");map.getPane("labels").style.zIndex=450;map.getPane("labels").style.pointerEvents="none";
L.tileLayer(ESRI+"World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:16,pane:"labels"}).addTo(map);
const lines=L.layerGroup().addTo(map), nums=L.layerGroup().addTo(map);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={free:css("--go"),pay:css("--pay"),stop:css("--stop")};

// ---------- time
let offsetH=0;
const at=()=>Date.now()+offsetH*36e5;
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{offsetH=+b.dataset.h;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
function whenLabel(t,from){const a=P.ny(t),b=P.ny(from);const d=Math.round((Date.parse(a.key)-Date.parse(b.key))/864e5);
  return `${d===0?"today":d===1?"tomorrow":P.DAYS_LONG[a.dow]} ${P.hm(a.min)}`;}
function statusLine(){const p=P.ny(Date.now()),h=P.HOL[p.key];const asp=!!h||p.dow===0,met=(h&&h[1])||p.dow===0;
  document.getElementById("clock").textContent=`${P.DAYS_LONG[p.dow]} · ${P.hm(p.min)}`;
  const tag=document.getElementById("dayTag");
  tag.textContent=asp&&met?"Easy day":asp?"No cleaning":"Regular rules";
  tag.className="tag"+(asp?" good":"");}

// ---------- data
const CELL=2500, cells=new Map(), blocks=new Map();
const ord=n=>n+(/1[123]$/.test(n)?"th":n.endsWith("1")?"st":n.endsWith("2")?"nd":n.endsWith("3")?"rd":"th");
function nice(s){return (s||"").replace(/\s+/g," ").trim()
  .replace(/\bWEST\b/g,"W").replace(/\bEAST\b/g,"E").replace(/\bNORTH\b/g,"N").replace(/\bSOUTH\b/g,"S")
  .replace(/\bSTREET\b/g,"St").replace(/\bAVENUE\b/g,"Ave").replace(/\bBOULEVARD\b/g,"Blvd").replace(/\bDRIVE\b/g,"Dr").replace(/\bPLACE\b/g,"Pl").replace(/\bROAD\b/g,"Rd").replace(/\bPARKWAY\b/g,"Pkwy").replace(/\bTERRACE\b/g,"Ter")
  .toLowerCase().replace(/\b([a-z])/g,c=>c.toUpperCase())
  .replace(/\b(\d+) (St|Ave)\b/g,(m,n,s)=>ord(n)+" "+s);}
const SIDE={N:"north side",S:"south side",E:"east side",W:"west side"};
async function loadCell(cx,cy){
  const key=cx+":"+cy; if(cells.has(key))return; cells.set(key,"loading");
  const x0=cx*CELL,y0=cy*CELL;
  const q=new URLSearchParams({"$select":"order_number,on_street,from_street,to_street,side_of_street,sign_description,distance_from_intersection,sign_x_coord,sign_y_coord",
    "$where":`record_type='Current' AND sign_x_coord::number between ${x0} and ${x0+CELL} AND sign_y_coord::number between ${y0} and ${y0+CELL} AND sign_description not like '%PANEL%'`,"$limit":"20000"});
  try{
    const r=await fetch("https://data.cityofnewyork.us/resource/nfid-uabd.json?"+q); if(!r.ok)throw new Error(r.status);
    for(const w of await r.json()){
      const sign=P.parseSign(w.sign_description||""); const x=+w.sign_x_coord,y=+w.sign_y_coord; if(!x||!y)continue;
      const k=w.order_number+"|"+(w.side_of_street||"");
      let b=blocks.get(k); if(!b){b={key:k,on:nice(w.on_street),from:nice(w.from_street),to:nice(w.to_street),side:w.side_of_street,signs:new Map(),pts:new Map()};blocks.set(k,b);
        const fix=(window.CORRECTIONS||{})[k]; if(fix){b.fixed=fix.date;b.fixedFree=!!fix.free;b.verifiedFree=!!fix.free;for(const d of fix.signs){const ps=P.parseSign(d);if(ps)b.signs.set(ps.text,ps);}}}
      if(sign)(b.city||b.signs).set(sign.text,sign);
      if(/PAY-BY-CELL|MUNI-METER/i.test(w.sign_description||""))b.meterLoc=true;
      b.dirty=true;
      b.pts.set(x+","+y,{d:+w.distance_from_intersection||0,ll:toLL(x,y)});
    }
    cells.set(key,"done"); for(const b of blocks.values()){delete b.metNear;if(b.dirty){if(!b.city)b.city=new Map(b.signs);b.dirty=false;applyMine(b);}}
  }catch(e){cells.delete(key);setMsg("Couldn't load parking signs. Check your connection, then move the map.");}
}
let loadingN=0;
async function loadView(){
  if(map.getZoom()<15){render();return;}
  const b=map.getBounds();const cs=[b.getNorthWest(),b.getNorthEast(),b.getSouthWest(),b.getSouthEast()].map(c=>toSP(c.lat,c.lng));
  const xs=cs.map(c=>c[0]),ys=cs.map(c=>c[1]),need=[];
  for(let cx=Math.floor(Math.min(...xs)/CELL);cx<=Math.floor(Math.max(...xs)/CELL);cx++)for(let cy=Math.floor(Math.min(...ys)/CELL);cy<=Math.floor(Math.max(...ys)/CELL);cy++)if(!cells.has(cx+":"+cy))need.push([cx,cy]);
  if(!need.length){render();return;}
  loadingN++; if(!document.querySelector(".spot"))setMsg("Loading parking signs…");
  await Promise.all(need.slice(0,30).map(([a,c])=>loadCell(a,c)));
  loadingN--; render();
}

// ---------- your own fixes (saved on this phone)
const MINE_KEY="mfp.mysigns.v1";
let MINE={};try{MINE=JSON.parse(localStorage.getItem(MINE_KEY))||{}}catch(e){}
function saveMine(){try{localStorage.setItem(MINE_KEY,JSON.stringify(MINE))}catch(e){}}
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function dayText(d){const k=d.slice().sort().join("");if(k==="0123456")return "Every day";if(k==="12345")return "Mon–Fri";if(k==="123456")return "Mon–Sat";return d.slice().sort().map(x=>DN[x]).join(", ");}
const KIND_TXT={meter:"Meter",stop:"No parking",asp:"Street cleaning"};
function mineSign(r){return {kind:r.kind,rules:[{days:r.days,s:r.s,e:r.e}],text:`Your sign: ${KIND_TXT[r.kind]} ${dayText(r.days)} ${P.hm(r.s)}–${r.e===1440?"midnight":P.hm(r.e)}`};}
function applyMine(b){
  const m=MINE[b.key]; b.mine=m?m.date:null; b.verifiedFree=!!b.fixedFree;
  if(!b.city)b.city=new Map(b.signs);
  if(!m){b.signs=new Map(b.city);return;}
  if(m.free){b.signs=new Map(b.city);b.verifiedFree=true;return;}
  const mine=new Map(m.rows.map(r=>{const x=mineSign(r);return [x.text,x];}));
  b.signs=m.replace?mine:new Map([...b.city,...mine]);
  b.verifiedFree=true;
}

// A block with meters but no passenger meter hours on file: likely paid, city data incomplete
const hasMeter=b=>b.meterLoc||[...b.signs.values()].some(x=>x.kind==="meter");
function metered(b){ // this block, or its neighbors on the same street and side, have meters
  if(b.metNear!==undefined)return b.metNear;
  if(hasMeter(b))return b.metNear=true;
  const m=b.pts.values().next().value; if(!m)return b.metNear=false;
  for(const o of blocks.values()){if(o===b||o.on!==b.on||o.side!==b.side||!hasMeter(o))continue;
    const p=o.pts.values().next().value; if(p&&dist(m.ll,p.ll)<750)return b.metNear=true;}
  return b.metNear=false;}
function blockState(b,t){const signs=[...b.signs.values()],s=P.stateAt(signs,t);
  if(s.st==="free"&&!b.verifiedFree&&metered(b)&&!signs.some(x=>x.kind==="meter"))return {st:"check",why:null};
  return s;}
// ---------- draw: free blocks bold green, everything else thin and faded
function render(){
  statusLine(); lines.clearLayers();
  if(map.getZoom()<15){nums.clearLayers();setMsg("Zoom in to see each block.");return;}
  const t=at(), view=map.getBounds().pad(.2), free=[];
  for(const b of blocks.values()){
    if(!b.signs.size&&!b.mine)continue;
    const pts=[...b.pts.values()].sort((a,c)=>a.d-c.d).map(p=>p.ll); if(!view.contains(pts[0]))continue;
    const s=blockState(b,t); b.st=s.st; b.mid=pts[Math.floor(pts.length/2)]; b.pts2=pts;
    if(s.st==="free"){free.push(b);continue;}
    const o={color:s.st==="check"?C.pay:C[s.st],weight:3,opacity:s.st==="stop"?.35:.6,lineCap:"round",dashArray:s.st==="check"?"6 6":null};
    const sh=pts.length>1?L.polyline(pts,o):L.circleMarker(pts[0],{...o,radius:3,fillOpacity:.5});
    sh.on("click",()=>openPop(b));sh.addTo(lines);
  }
  for(const b of free){ // white casing under green so it stands out
    if(b.pts2.length>1){L.polyline(b.pts2,{color:"#fff",weight:11,opacity:.95,lineCap:"round",interactive:false}).addTo(lines);
      L.polyline(b.pts2,{color:C.free,weight:7,opacity:1,lineCap:"round"}).on("click",()=>openPop(b)).addTo(lines);}
    else L.circleMarker(b.pts2[0],{radius:6,color:"#fff",weight:3,fillColor:C.free,fillOpacity:1}).on("click",()=>openPop(b)).addTo(lines);
  }
  document.getElementById("count").textContent=free.length?`${free.length} free blocks`:"";
  renderList();
}
const dirUrl=ll=>`https://www.google.com/maps/dir/?api=1&destination=${ll[0].toFixed(6)},${ll[1].toFixed(6)}&travelmode=driving`;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function between(b){return `between ${b.from} & ${b.to}${SIDE[b.side]?" · "+SIDE[b.side]:""}`;}
// Street View facing the curb on this side of the block
function bearing(a,c){const r=Math.PI/180,y=Math.sin((c[1]-a[1])*r)*Math.cos(c[0]*r),x=Math.cos(a[0]*r)*Math.sin(c[0]*r)-Math.sin(a[0]*r)*Math.cos(c[0]*r)*Math.cos((c[1]-a[1])*r);return (Math.atan2(y,x)/r+360)%360;}
function svUrl(b){if(!b.mid){const q=[...b.pts.values()].map(x=>x.ll);b.mid=q[Math.floor(q.length/2)];b.pts2=q;}const p=b.pts2||[b.mid];let h=0;
  if(p.length>1){const br=bearing(p[0],p[p.length-1]),want={N:0,E:90,S:180,W:270}[b.side];
    if(want!==undefined){const a=(br+90)%360,c=(br+270)%360,dd=x=>Math.min(Math.abs(x-want),360-Math.abs(x-want));h=dd(a)<dd(c)?a:c;}}
  return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${b.mid[0].toFixed(6)},${b.mid[1].toFixed(6)}&heading=${Math.round(h)}&pitch=5&fov=80`;}
let popBlock=null;
function openPop(b){popBlock=b;const t=at(),signs=[...b.signs.values()],s=blockState(b,t),n=s.st==="check"?null:P.nextChange(signs,t,s.st,4);
  const u=n?" until "+whenLabel(n.t,t):"";
  const line=s.st==="check"?`<span style="color:var(--pay)">Meter — check hours on the muni-meter</span><div class="between" style="font-weight:400">Meters are on or next to this block, but the city's data doesn't list their hours.</div>`:s.st==="free"?`<span style="color:var(--go-dark)">Free${n?u:" for 4+ days"}</span>`:s.st==="pay"?`<span style="color:var(--pay)">Pay meter${u}</span>`:`<span style="color:var(--stop)">No parking${u}</span>`;
  L.popup({maxWidth:270,autoPanPaddingTopLeft:L.point(12,(document.querySelector('.top').offsetHeight||200)+24),autoPanPaddingBottomRight:L.point(12,(document.getElementById('sheet').offsetHeight||200)+16)}).setLatLng(b.mid).setContent(`<div class="pop"><div class="street">${esc(b.on)}</div><div class="between">${esc(between(b))}</div>
    <div class="s">${line}</div>${s.st==="free"?`<a class="go" href="${dirUrl(b.mid)}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.7 11.3 12.7 2.3a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4ZM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5Z"/></svg>Go</a>`:""}
    ${b.mine?`<span class="mine">✎ Your fix · ${esc(b.mine)}</span>`:b.fixed?`<div class="between">✓ Sign checked on the street ${esc(b.fixed)}</div>`:""}
    <div class="acts"><a class="ghost" href="${svUrl(b)}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="M9 21v-6H7.5V10a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v5H15v6"/></svg>See the sign</a>
    <button class="ghost" onclick="openEditor(popBlock)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg>Sign is different</button></div><details><summary>Signs on this block</summary><ul>${signs.map(x=>`<li>${esc(x.text)}</li>`).join("")}</ul></details></div>`).openOn(map);}

// ---------- sign editor
let edBlock=null, edRows=[], edFree=false;
const $=id=>document.getElementById(id);
function rowHTML(r,i){return `<div class="row" data-i="${i}"><div class="row-top"><div class="kinds">${["meter","stop","asp"].map(k=>`<button data-k="${k}" aria-pressed="${r.kind===k}">${KIND_TXT[k]}</button>`).join("")}</div>
  ${edRows.length>1?`<button class="del" aria-label="Remove line">×</button>`:""}</div>
  <div class="dchips">${DN.map((d,j)=>`<button data-d="${j}" aria-pressed="${r.days.includes(j)}">${d}</button>`).join("")}</div>
  <div class="tm"><input type="time" id="s${i}" value="${tt(r.s)}" aria-label="From"><span class="note">to</span><input type="time" id="e${i}" value="${tt(r.e)}" aria-label="Until (00:00 = midnight)"></div></div>`;}
const tt=m=>{m=m%1440;return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;};
const ft=v=>{const[a,c]=v.split(":").map(Number);return a*60+c;};
function drawRows(){
  $("rows").innerHTML=edRows.map(rowHTML).join("");
  $("rows").querySelectorAll(".row").forEach(el=>{const r=edRows[+el.dataset.i];
    el.querySelectorAll(".kinds button").forEach(x=>x.onclick=()=>{r.kind=x.dataset.k;drawRows();});
    el.querySelectorAll(".dchips button").forEach(x=>x.onclick=()=>{const d=+x.dataset.d;r.days=r.days.includes(d)?r.days.filter(z=>z!==d):[...r.days,d];drawRows();});
    const del=el.querySelector(".del"); if(del)del.onclick=()=>{edRows.splice(+el.dataset.i,1);drawRows();};
    el.querySelector(`#s${el.dataset.i}`).onchange=e=>{if(e.target.value)r.s=ft(e.target.value);};
    el.querySelector(`#e${el.dataset.i}`).onchange=e=>{if(e.target.value){const v=ft(e.target.value);r.e=v===0?1440:v;}};
  });}
function setMode(free){edFree=free;$("qFree").classList.toggle("on",free);$("qCustom").classList.toggle("on",!free);$("custom").style.display=free?"none":"flex";}
function openEditor(b){
  if(!b)return; edBlock=b; map.closePopup();
  $("edWhere").textContent=`${b.on} · ${between(b)}`;
  const m=MINE[b.key];
  edRows=m&&m.rows&&m.rows.length?m.rows.map(r=>({...r,days:r.days.slice()})):[{kind:"meter",days:[1,2,3,4,5],s:19*60,e:1440}];
  $("replace").checked=m?!!m.replace:false;
  setMode(!!(m&&m.free)); drawRows();
  $("edReset").hidden=!m; $("edBack").hidden=false;
}
function closeEditor(){$("edBack").hidden=true;}
$("qFree").onclick=()=>setMode(true); $("qCustom").onclick=()=>setMode(false);
$("addRow").onclick=()=>{edRows.push({kind:"meter",days:[6],s:8*60,e:1440});drawRows();};
$("edCancel").onclick=closeEditor;
$("edBack").addEventListener("click",e=>{if(e.target.id==="edBack")closeEditor();});
const today=()=>new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
$("edSave").onclick=()=>{
  if(edFree)MINE[edBlock.key]={date:today(),free:true};
  else{const rows=edRows.filter(r=>r.days.length&&r.e!==r.s);if(!rows.length){closeEditor();return;}
    MINE[edBlock.key]={date:today(),replace:$("replace").checked,rows};}
  saveMine(); applyMine(edBlock); delete edBlock.metNear; closeEditor(); render(); openPop(edBlock);
};
$("edReset").onclick=()=>{delete MINE[edBlock.key];saveMine();applyMine(edBlock);closeEditor();render();openPop(edBlock);};

// ---------- saved places
const PLACES=[{short:"18 W 33rd St",ll:[40.7481,-73.9862]}];
let place=0, placeMark=null;
function showPlace(i){if(placeMark){map.removeLayer(placeMark);placeMark=null;}if(i==null)return;
  placeMark=L.marker(PLACES[i].ll,{interactive:false,icon:L.divIcon({className:"",iconSize:[0,0],html:`<div class="pin"><span>★ ${PLACES[i].short}</span><i></i></div>`})}).addTo(map);}
function choose(p){
  document.querySelectorAll("#places button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===String(p)));
  if(p==="me"){place=null;showPlace(null);if(me)map.setView(me,17);else{followed=false;startGPS();}}
  else{place=+p;showPlace(place);map.setView(PLACES[place].ll,17);}
  renderList();
}
document.querySelectorAll("#places button").forEach(b=>b.onclick=()=>choose(b.dataset.p));

// ---------- list + numbered pins
function durTxt(ms){const h=Math.floor(ms/36e5),m=Math.round((ms%36e5)/6e4);if(ms>=4*864e5-1)return "4+ days";if(h>=48)return `${Math.floor(h/24)} days`;if(h>=10)return `${h} hr`;if(h>=1)return m>=30?`${h}.5 hr`:`${h} hr`;return `${m} min`;}
function shortWhen(t,from){const a=P.ny(t),b=P.ny(from);const d=Math.round((Date.parse(a.key)-Date.parse(b.key))/864e5);return `${d===0?"":d===1?"tmrw ":P.DAYS[a.dow]+" "}${P.hm(a.min)}`;}
let me=null;
function dist(a,b){const R=20902231,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const fmtD=f=>f<1000?`${Math.round(f/10)*10} ft`:`${(f/5280).toFixed(1)} mi`;
function setMsg(t){document.getElementById("list").innerHTML=`<div class="msg">${t}</div>`;}
function renderList(){
  if(loadingN)return; nums.clearLayers();
  const origin=place!=null?PLACES[place].ll:(me||[map.getCenter().lat,map.getCenter().lng]);
  document.getElementById("sheetTitle").textContent=place!=null?`Near ${PLACES[place].short}`:me?"Near you":"Near map center";
  const t=at();
  const top=[...blocks.values()].filter(b=>b.st==="free"&&b.mid).map(b=>({b,d:dist(origin,b.mid)})).sort((a,c)=>a.d-c.d).slice(0,25)
    .map(c=>{const n=P.nextChange([...c.b.signs.values()],t,"free",4);return {...c,n,dur:n?n.t-t:4*864e5};})
    .filter(c=>c.dur>=60*6e4).slice(0,3);
  if(!top.length){setMsg("No free blocks here right now. Move the map or try +1 hr.");return;}
  top.forEach((c,i)=>L.marker(c.b.mid,{icon:L.divIcon({className:"",iconSize:[0,0],html:`<div class="num">${i+1}</div>`})}).on("click",()=>openPop(c.b)).addTo(nums));
  document.getElementById("list").innerHTML=top.map((c,i)=>`<div class="spot" data-i="${i}"><span class="n">${i+1}</span>
    <div><div class="street">${esc(c.b.on)}</div><div class="between">${esc(between(c.b))} · ${fmtD(c.d)}</div>
    <div class="until"><b>${durTxt(c.dur)}</b> free${c.n?" · "+shortWhen(c.n.t,t):""}</div></div>
    <a class="go" href="${dirUrl(c.b.mid)}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.7 11.3 12.7 2.3a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4ZM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5Z"/></svg>Go</a></div>`).join("");
  document.querySelectorAll(".spot").forEach(el=>el.addEventListener("click",e=>{if(e.target.closest("a"))return;map.flyTo(top[+el.dataset.i].b.mid,18);}));
}

// ---------- my location
let meDot=null,meRing=null,followed=false;
function onPos(p){me=[p.coords.latitude,p.coords.longitude];
  if(!meDot){meRing=L.circle(me,{radius:p.coords.accuracy,color:css("--me"),weight:1,fillOpacity:.08,interactive:false}).addTo(map);
    meDot=L.marker(me,{interactive:false,icon:L.divIcon({className:"",iconSize:[0,0],html:'<div class="medot"></div>'})}).addTo(map);}
  else{meDot.setLatLng(me);meRing.setLatLng(me).setRadius(p.coords.accuracy);}
  if(!followed&&place==null){followed=true;map.setView(me,17);} else if(place==null)renderList();}
function onErr(){if(!me&&place==null)setMsg("Location is off. Allow location for this site, or tap ★ 18 W 33rd St.");}
function startGPS(){if(!navigator.geolocation){onErr();return;}navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:10000,timeout:15000});}
document.getElementById("locate").onclick=()=>choose("me");

// ---------- layout
const sheet=document.getElementById("sheet");
document.getElementById("grab").onclick=()=>sheet.classList.toggle("collapsed");
function placeBtn(){const b=(sheet.offsetHeight+12)+"px";document.getElementById("locate").style.bottom=b;document.getElementById("legend").style.bottom=b;}
new ResizeObserver(placeBtn).observe(sheet);
let tmr;map.on("moveend",()=>{clearTimeout(tmr);tmr=setTimeout(loadView,250);});
statusLine();showPlace(0);startGPS();loadView();
setInterval(()=>{if(offsetH===0)render();},60000);
</script>
</body>
